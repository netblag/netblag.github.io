<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Admin — Ashkan Ahmadi</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0d0c;
      color: #f2f4ef;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .container {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 60px;
    }

    .panel {
      background: #121513;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
    }

    .login {
      width: min(430px, 100%);
      margin: 8vh auto 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: -.04em;
    }

    p {
      margin: 0;
    }

    .muted {
      color: #9aa19a;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      background: #0b0d0c;
      color: #f2f4ef;
      outline: none;
    }

    input:focus {
      border-color: #b5f23d;
      box-shadow: 0 0 0 4px rgba(181,242,61,.12);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .primary {
      background: #b5f23d;
      color: #0b0d0c;
    }

    .secondary {
      background: #242925;
      color: #f2f4ef;
    }

    .danger {
      background: #d2613f;
      color: #fff;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 24px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .error {
      color: #ff9d86;
      margin-top: 14px;
    }

    .messages {
      display: grid;
      gap: 14px;
    }

    .message {
      background: #161a18;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      padding: 18px;
    }

    .message.unread {
      border-color: #b5f23d;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .name {
      font-size: 17px;
      font-weight: 650;
    }

    .date {
      margin-top: 5px;
      font-size: 12px;
      color: #9aa19a;
    }

    .message-text {
      margin: 16px 0;
      white-space: pre-wrap;
      line-height: 1.7;
      color: #e7ebe5;
    }

    .badge {
      font-size: 11px;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      color: #9aa19a;
    }

    .badge.unread {
      color: #b5f23d;
      border-color: #b5f23d;
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: #9aa19a;
      border: 1px dashed rgba(255,255,255,.1);
      border-radius: 16px;
    }

    .stats {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .stat {
      font-size: 12px;
      color: #9aa19a;
      background: #0d100e;
      border: 1px solid rgba(255,255,255,.08);
      padding: 6px 10px;
      border-radius: 999px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 640px) {
      .container {
        width: min(100% - 20px, 1100px);
        padding-top: 20px;
      }

      .panel {
        padding: 20px;
      }

      .top {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <section id="loginPanel" class="panel login">

    <h1>Admin Login</h1>

    <p class="muted">
      Private message dashboard
    </p>

    <div id="loginError" class="error"></div>

    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      autocomplete="username"
      value="netblag.dev@gmail.com"
    >

    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
    >

    <button
      id="loginBtn"
      class="primary"
      style="width:100%;margin-top:20px"
    >
      Login
    </button>

  </section>


  <!-- DASHBOARD -->
  <section id="dashboard" class="panel hidden">

    <div class="top">

      <div>
        <h1>Messages</h1>

        <p class="muted">
          Private inbox
        </p>

        <div class="stats">
          <span class="stat" id="totalStat">
            0 total
          </span>

          <span class="stat" id="unreadStat">
            0 unread
          </span>
        </div>
      </div>

      <div class="actions">

        <button
          id="refreshBtn"
          class="secondary"
        >
          Refresh
        </button>

        <button
          id="logoutBtn"
          class="secondary"
        >
          Logout
        </button>

      </div>

    </div>

    <div id="appError" class="error"></div>

    <div
      id="messages"
      class="messages"
    ></div>

  </section>

</div>


<script>
"use strict";


/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://hwuefybpivkwqnztssfc.supabase.co";


/*
  IMPORTANT:
  Put the SAME Publishable / anon key that you placed
  in the main index.html here.
*/

const SUPABASE_KEY =
  "sb_publishable_yfa45TH54vBmXcb3Tdr-Jw_BFLYnZ0o";


const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   ELEMENTS
   ========================================================= */

const loginPanel =
  document.getElementById("loginPanel");

const dashboard =
  document.getElementById("dashboard");

const loginError =
  document.getElementById("loginError");

const appError =
  document.getElementById("appError");

const messagesEl =
  document.getElementById("messages");

const totalStat =
  document.getElementById("totalStat");

const unreadStat =
  document.getElementById("unreadStat");


/* =========================================================
   UI
   ========================================================= */

function showLogin() {

  loginPanel.classList.remove("hidden");
  dashboard.classList.add("hidden");

}


function showDashboard() {

  loginPanel.classList.add("hidden");
  dashboard.classList.remove("hidden");

}


/* =========================================================
   SECURITY
   ========================================================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


async function isAdmin(userId) {

  const { data, error } =
    await client
      .from("admin_users")
      .select("user_id")
      .eq("user_id", userId)
      .maybeSingle();

  return !error && !!data;

}


/* =========================================================
   LOAD MESSAGES
   ========================================================= */

async function loadMessages() {

  appError.textContent = "";

  const {
    data,
    error
  } =
    await client
      .from("messages")
      .select(
        "id,name,message,read,created_at"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    appError.textContent =
      "Could not load messages.";

    return;

  }


  const rows = data || [];


  totalStat.textContent =
    `${rows.length} total`;


  unreadStat.textContent =
    `${rows.filter(
      message => !message.read
    ).length} unread`;


  if (!rows.length) {

    messagesEl.innerHTML =
      `<div class="empty">
        No messages yet.
       </div>`;

    return;

  }


  messagesEl.innerHTML =
    rows.map(message => {

      const date =
        new Date(
          message.created_at
        ).toLocaleString();


      return `
        <article
          class="message ${
            message.read ? "" : "unread"
          }"
        >

          <div class="message-header">

            <div>

              <div class="name">
                ${escapeHtml(message.name)}
              </div>

              <div class="date">
                ${escapeHtml(date)}
              </div>

            </div>

            <span
              class="badge ${
                message.read ? "" : "unread"
              }"
            >
              ${
                message.read
                  ? "Read"
                  : "Unread"
              }
            </span>

          </div>


          <div class="message-text">
            ${escapeHtml(message.message)}
          </div>


          <div class="actions">

            <button
              class="secondary"
              data-action="toggle"
              data-id="${escapeHtml(message.id)}"
              data-read="${message.read ? "false" : "true"}"
            >
              ${
                message.read
                  ? "Mark unread"
                  : "Mark read"
              }
            </button>


            <button
              class="danger"
              data-action="delete"
              data-id="${escapeHtml(message.id)}"
            >
              Delete
            </button>

          </div>

        </article>
      `;

    }).join("");

}


/* =========================================================
   MESSAGE ACTIONS
   ========================================================= */

messagesEl.addEventListener(
  "click",
  async function(event) {

    const button =
      event.target.closest(
        "button[data-action]"
      );

    if (!button) return;


    const id =
      button.dataset.id;

    const action =
      button.dataset.action;


    button.disabled = true;

    try {

      if (action === "toggle") {

        const read =
          button.dataset.read === "true";


        const { error } =
          await client
            .from("messages")
            .update({ read })
            .eq("id", id);


        if (error) {
          throw error;
        }

      }


      if (action === "delete") {

        const confirmed =
          window.confirm(
            "Delete this message permanently?"
          );


        if (!confirmed) {
          return;
        }


        const { error } =
          await client
            .from("messages")
            .delete()
            .eq("id", id);


        if (error) {
          throw error;
        }

      }


      await loadMessages();

    } catch (error) {

      console.error(error);

      appError.textContent =
        "The operation failed or was not allowed.";

    } finally {

      button.disabled = false;

    }

  }
);


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

  loginError.textContent = "";

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if (!email || !password) {

    loginError.textContent =
      "Enter your email and password.";

    return;

  }


  const {
    data,
    error
  } =
    await client.auth.signInWithPassword({

      email,
      password

    });


  if (error || !data?.user) {

    console.error(error);

    loginError.textContent =
      "Invalid email or password.";

    return;

  }


  const allowed =
    await isAdmin(
      data.user.id
    );


  if (!allowed) {

    await client.auth.signOut();

    loginError.textContent =
      "This account is not authorized.";

    return;

  }


  showDashboard();

  await loadMessages();

}


document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    login
  );


document
  .getElementById("password")
  .addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        login();
      }

    }
  );


/* =========================================================
   LOGOUT
   ========================================================= */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      await client.auth.signOut();

      showLogin();

    }
  );


/* =========================================================
   REFRESH
   ========================================================= */

document
  .getElementById("refreshBtn")
  .addEventListener(
    "click",
    loadMessages
  );


/* =========================================================
   INITIAL SESSION CHECK
   ========================================================= */

(async function() {

  if (
    SUPABASE_KEY ===
    "YOUR_PUBLISHABLE_KEY"
  ) {

    loginError.textContent =
      "Add your Supabase Publishable/anon key to admin/index.html.";

    showLogin();

    return;

  }


  const {
    data
  } =
    await client.auth.getSession();


  const session =
    data?.session;


  if (!session?.user) {

    showLogin();

    return;

  }


  const allowed =
    await isAdmin(
      session.user.id
    );


  if (!allowed) {

    await client.auth.signOut();

    showLogin();

    return;

  }


  showDashboard();

  await loadMessages();

})();
</script>

</body>
</html>
